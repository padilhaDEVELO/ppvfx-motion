# Valida, constrói e publica somente o artefato aprovado (dist/) no GitHub Pages.
# - Ações fixadas por SHA de commit (tag entre comentários só para leitura).
# - Permissões mínimas por job; só o job de publicação recebe pages/id-token.
# - Pull requests rodam build e testes sem credenciais de publicação e nunca publicam.
# - Sem pull_request_target, sem segredos, sem código de terceiros com token de escrita.
name: Publicar portfólio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    name: Validar e construir
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile exato)
        run: npm ci --no-fund

      - name: Auditoria de dependências (bloqueia alta/crítica)
        run: npm audit --audit-level=high

      - name: Build + verificação do artefato
        run: npm run build

      - name: Testes (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium --project=celular-android

      - name: Guardar relatório de testes em caso de falha
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relatorio-testes
          path: test-results/
          retention-days: 7

      - name: Enviar artefato do Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  publicar:
    name: Publicar no GitHub Pages
    needs: validar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
